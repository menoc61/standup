name: Release

# Builds every target from one version-matched tag and publishes only after all
# six platform builds have succeeded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.4"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Nothing is built or published unless analysis, tests, formatting and
  # Drift codegen freshness all pass on the tag itself.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify tag matches app version
        shell: bash
        run: |
          version="$(awk '/^version:/ { sub(/^version:[[:space:]]*/, ""); sub(/\+.*/, ""); print; exit }' pubspec.yaml)"
          expected_tag="v${version}"
          if [ -z "$version" ] || [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag '$RELEASE_TAG' must match pubspec version '$expected_tag'."
            exit 1
          fi
          echo "Building app version $version from $RELEASE_TAG"

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Drift code generation is up to date
        run: |
          dart run build_runner build
          if ! git diff --quiet -- lib/data/local/app_database.g.dart; then
            echo "::error::app_database.g.dart is out of date. Run:"
            echo "  dart run build_runner build"
            git --no-pager diff --stat -- lib/data/local/app_database.g.dart
            exit 1
          fi

      - name: Run tests
        run: flutter test

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

  # ---------------------------------------------------------------------------
  # Android. The APK is the primary distribution artefact for the pilot, so the
  # bundle is uploaded both as a workflow artifact and onto the release itself.
  # ---------------------------------------------------------------------------
  android:
    name: Android release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      # Consumed by the publish job so a failure here fails the release loudly
      # rather than silently shipping without the APK.
      ok: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # No android-actions/setup-android step: it runs `sdkmanager --list`, which
      # now fails on the current runner image because Google retired the 'tools'
      # package name. The hosted image ships a usable SDK already.

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        id: build
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/standup-${RELEASE_TAG}-android.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             dist/standup-${RELEASE_TAG}-android.aab
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Web. Include Drift's SQLite WASM files in the downloadable static bundle.
  # ---------------------------------------------------------------------------
  web:
    name: Web release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Copy and verify Drift web assets
        run: |
          bash ./scripts/standup.sh build web release --skip-build
          test -f build/web/sqlite3.wasm
          test -f build/web/drift_worker.js

      - name: Package web bundle
        run: |
          mkdir -p dist
          cd build/web
          zip -qr "../../dist/standup-${RELEASE_TAG}-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows. Requires no secret today: the bundle is unsigned, which is enough
  # to download and run, and signing needs a certificate the repository does
  # not hold yet. The job ships both a zip (as before) and an Inno Setup
  # installer, which is what staff should be pointed at.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows release
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package as a zip
        run: |
          # Compress-Archive does not create the destination directory, so the
          # first release failed here rather than at the upload step.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\standup-$env:RELEASE_TAG-windows-x64.zip" `
            -Force
          Get-Item "dist\standup-$env:RELEASE_TAG-windows-x64.zip" |
            Format-List Name,Length

      # The zip is kept for parity and for users who unpack by hand, but the
      # installer is the artifact to point staff at: it gives a Start Menu
      # entry, an Add/Remove Programs entry, a real uninstall and an upgrade
      # path. The zip has none of those.
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress --limit-output

      - name: Build the installer
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' |
            Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw 'Could not read version from pubspec.yaml' }

          # Signing is opt-in: the certificate is a repository secret that does
          # not exist yet. Until it does, the installer is unsigned, which
          # means SmartScreen still warns - see docs/INSTALL_AND_LAUNCH.md.
          $args = @(
            "/DAppVersion=$version"
            "/DBuildRoot=$PWD\build\windows\x64\runner\Release"
            "/DOutputDir=$PWD\dist"
            "scripts\windows\standup.iss"
          )
          if ($env:WINDOWS_SIGNTOOL) { $args = "/DSignToolCommand=$env:WINDOWS_SIGNTOOL" + $args }
          # `${env:ProgramFiles(x86)}` needs the braces. PowerShell parses a bare
          # `$env:ProgramFiles(x86)` as `$env:ProgramFiles` followed by the literal
          # text `(x86)`, which resolves to "C:\Program Files(x86)\..." and fails
          # with a command-not-found error rather than a path error.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @args
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist\*.exe | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Linux. GTK, clang and ninja are the same packages the TUI's
  # `setup --linux-deps` installs, plus the GStreamer headers audioplayers needs.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libblkid-dev uuid-dev libxss-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux
        run: |
          # Same reason as the CI job: a link failure must not reach the release
          # log as a bare "linker command failed". If the build fails, the link
          # is re-run directly so the undefined symbol is in the log before
          # anyone goes looking for it.
          if ! flutter build linux --release -v; then
            echo "::error::Linux release build failed; re-running the link directly"
            if [ -d build/linux/x64/release ]; then
              cmake --build build/linux/x64/release --config Release --verbose || true
            else
              echo "No CMake build directory exists, so the link could not be re-run."
            fi
            exit 1
          fi

      - name: Package as a tarball
        run: |
          mkdir -p dist
          tar -czf "dist/standup-${RELEASE_TAG}-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle
          ls -la dist

      # Fail loudly if the desktop entry or the icon set did not get installed.
      # CMake owns both, and a missing .desktop produces an app that launches but
      # never appears in any desktop menu.
      #
      # The bundle lives under build/linux/x64/release/bundle, not at the
      # repository root — checking the wrong path is how the first release
      # published without a working Linux icon.
      - name: Verify desktop integration
        run: |
          bundle=build/linux/x64/release/bundle
          test -f "$bundle/share/applications/standup_app.desktop" || \
            (echo "::error::.desktop entry missing from the bundle" && exit 1)
          test -f "$bundle/share/icons/hicolor/512x512/apps/standup_app.png" || \
            (echo "::error::512px icon missing from the bundle" && exit 1)
          # GTK resolves Icon= by stem against the installed theme, so the name
          # in the entry has to match the name that was actually installed.
          grep -q "^Icon=standup_app$" "$bundle/share/applications/standup_app.desktop" || \
            (echo "::error::Icon= does not match the installed icon stem" && exit 1)
          find "$bundle/share" -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Apple. iOS and macOS, unsigned.
  #
  # Two things make this more than `flutter build ios`:
  #   * the WidgetKit extension target has to be added to the Xcode project
  #     first, which is what scripts/ios/add_widget_target.rb does;
  #   * both targets need the App Group capability, which is set on the target
  #     by the same script so signing has something to attach to.
  #
  # Unsigned, so these are verification and simulator artefacts rather than
  # App Store submissions. Publishing to the App Store needs a certificate that
  # the repository does not hold.
  # ---------------------------------------------------------------------------
  apple:
    name: Apple release
    needs: verify
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install the WidgetKit extension target
        run: |
          gem install xcodeproj --no-document
          ruby scripts/ios/add_widget_target.rb

      # Assert the references resolve to files that exist.
      #
      # A file reference whose group has no path silently resolves against the
      # project directory, so the pbxproj looks correct and the build dies much
      # later with "Build input files cannot be found". Checking here names the
      # actual file that is wrong.
      - name: Verify the widget target's sources resolve
        run: |
          fail=0
          for f in CNPSStandUpWidget StandUpIntents StandUpProvider \
                   StandUpWidgetView WidgetPayload WidgetStyle; do
            if grep -q "StandUpWidget/$f.swift" ios/Runner.xcodeproj/project.pbxproj; then
              echo "ok   StandUpWidget/$f.swift"
            else
              echo "::error::$f.swift is not referenced under ios/StandUpWidget/" >&2
              fail=1
            fi
          done
          # A widget source written as a bare filename resolves against ios/
          # instead of ios/StandUpWidget/. The check is scoped to the widget's
          # own filenames because the stock Runner sources (AppDelegate.swift,
          # SceneDelegate.swift, RunnerTests.swift) legitimately use bare paths.
          if grep -qE 'path = (CNPSStandUpWidget|StandUpIntents|StandUpProvider|StandUpWidgetView|WidgetPayload|WidgetStyle)\.swift;' ios/Runner.xcodeproj/project.pbxproj; then
            echo "::error::a widget Swift reference has no directory prefix" >&2
            fail=1
          fi
          exit $fail

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Build macOS
        run: flutter build macos --release

      - name: Package iOS Runner.app
        run: |
          mkdir -p dist
          # A .app is a directory, so it has to be zipped rather than copied.
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app "dist/standup-${RELEASE_TAG}-ios.app.zip"
          ls -la dist

      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/standup_app.app" \
            "dist/standup-${RELEASE_TAG}-macos.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-apple
          path: dist
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publish.
  #
  # Five platforms are required: verify, Android, Web, Windows and Linux. A
  # failure in any of them blocks the release, because a missing artefact cannot
  # be fixed by a release note.
  #
  # Apple is the one exception, and it is a temporary one. The iOS/macOS job has
  # never produced a build -- it fails on an Xcode dependency cycle in the Embed
  # App Extensions phase that only a macOS host can diagnose and verify. The
  # WidgetKit extension itself compiles.
  #
  # This used to be `!cancelled()`, which let a release ship with no iOS or macOS
  # artefact and nothing in the notes saying so: that is exactly what happened to
  # v1.0.0. So the omission is now stated in the release body itself rather than
  # being quietly tolerated. Deleting the apple entry below, and its `needs`
  # reference, restores strict behaviour once the cycle is fixed.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [verify, android, web, windows, linux, apple]
    if: ${{ always() && needs.verify.result == 'success' && needs.android.result == 'success' && needs.web.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release contents
        run: |
          ls -laR dist
          # Nothing to release is a failed release, not an empty one.
          test -n "$(ls -A dist)" || (echo "::error::no artefacts were produced" && exit 1)

      # Builds the note that says which platforms this release actually has.
      # It runs whether or not Apple succeeded, because a release that is
      # complete should not gain a "missing iOS" banner it does not need.
      - name: Describe the platforms in this release
        id: platforms
        env:
          APPLE_RESULT: ${{ needs.apple.result }}
        run: |
          {
            echo "## Artefacts in this release"
            echo
            for f in dist/*; do echo "- \`$(basename "$f")\`"; done
            echo
            if [ "$APPLE_RESULT" = "success" ]; then
              echo "All six targets were built: Android, Web, Windows, Linux, iOS and macOS."
            else
              echo "> [!WARNING]"
              echo "> **This release has no iOS or macOS build.**"
              echo "> The Apple job did not succeed (\`$APPLE_RESULT\`), so there is no"
              echo "> \`.app\` artefact to download. iOS and macOS are unsigned here in any"
              echo "> case and are not App Store submissions. Everything else — Android,"
              echo "> Windows, Linux and Web — built and is attached below."
              echo ">"
              echo "> See [docs/PLATFORM_SETUP.md](https://github.com/menoc61/standup/blob/${RELEASE_TAG}/docs/PLATFORM_SETUP.md)."
            fi
          } > notes.md
          cat notes.md
          # Outside the block above on purpose: an annotation is a workflow
          # directive, not release text, and inside it the raw ::warning:: line
          # would be rendered in the published body.
          if [ "$APPLE_RESULT" != "success" ]; then
            echo "::warning::iOS and macOS are missing from ${RELEASE_TAG} (apple job: $APPLE_RESULT)"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing its assets and notes."
            gh release upload "$RELEASE_TAG" dist/* --clobber
            # Rewritten, not just the assets: a re-run that succeeds must be able
            # to correct an earlier note that claimed a platform was missing.
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "CNPS StandUp $RELEASE_TAG" \
              --notes-file notes.md \
              --generate-notes \
              dist/*
          fi
