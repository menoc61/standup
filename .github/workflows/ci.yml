name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis and unit tests. Fast, and blocks everything downstream.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Fails on any linter warning, matching `flutter analyze` locally.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Drift code generation is up to date
        run: |
          dart run build_runner build
          if ! git diff --quiet -- lib/data/local/app_database.g.dart; then
            echo "::error::app_database.g.dart is out of date. Run:"
            echo "  dart run build_runner build"
            git --no-pager diff --stat -- lib/data/local/app_database.g.dart
            exit 1
          fi

      - name: Run tests
        run: flutter test --reporter expanded

      # The app's identity (bundle id, app group, app name, version) is declared
      # once in lib/core/app_identity.dart and stamped into the Gradle, Xcode,
      # CMake, .rc, .desktop, manifest.json and helper-script copies. This step
      # asserts none of them has drifted.
      #
      # It is a separate step rather than a test because running `dart run` from
      # inside `flutter test` deadlocks on the shared package-config lock. The
      # file-content assertions in test/identity_test.dart cover the same ground
      # for the values that matter at runtime.
      - name: Native identity files match AppIdentity
        run: |
          dart run tool/stamp_identity.dart --check || {
            echo "::error::Native identity has drifted from lib/core/app_identity.dart"
            echo "Run 'dart run tool/stamp_identity.dart' and commit the result."
            exit 1
          }

      - name: Format check
        run: |
          dart format --output=none --set-exit-if-changed lib test tool

  # ---------------------------------------------------------------------------
  # Android release build. Runs on every push so a broken Gradle setup is
  # caught before a tag is cut.
  # ---------------------------------------------------------------------------
  build-android:
    name: Android release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # No android-actions/setup-android step on purpose. That action shells out
      # to `sdkmanager --list`, which now fails on the current runner image with
      # "Failed to find package 'tools'" because Google retired that package
      # name. The hosted image already ships a working SDK with the build-tools
      # and platform versions this project needs, and the licences are already
      # accepted there.

      - name: Resolve dependencies
        run: flutter pub get

      # The release build type enables R8 and reads android/key.properties when
      # present. Without a keystore it falls back to the debug signing config,
      # which is enough to prove the build and the ProGuard rules work.
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Cloud features are compile-time: the app reads these through
          # String.fromEnvironment, so a build that is not given them can never
          # sign in, sync or reach the organisation dashboards - it is local-only
          # rather than broken, which is the documented fallback. Both values are
          # optional here so a fork without a project still builds.
          defines=()
          if [ -n "$SUPABASE_URL" ]; then
            defines+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            defines+=("--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY")
          fi
          if [ ${#defines[@]} -eq 2 ]; then
            echo "Cloud features enabled."
          else
            echo "::warning::Supabase credentials are absent or incomplete; this build is local-only."
          fi
          flutter build apk --release "${defines[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: standup-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Web release build, including the Drift WASM assets.
  # ---------------------------------------------------------------------------
  build-web:
    name: Web release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          defines=()
          if [ -n "$SUPABASE_URL" ]; then
            defines+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            defines+=("--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY")
          fi
          if [ ${#defines[@]} -eq 2 ]; then
            echo "Cloud features enabled."
          else
            echo "::warning::Supabase credentials are absent or incomplete; this build is local-only."
          fi
          flutter build web --release "${defines[@]}"

      # `flutter build web` has no knowledge of Drift, so the two WASM assets are
      # copied from the pub cache afterwards. The script is the single source of
      # truth for locating them; running it here means CI and a developer
      # following the TUI produce an identical bundle.
      - name: Copy Drift web assets
        run: bash ./scripts/standup.sh build web release --skip-build

      # The browser build cannot work without these two files served next to
      # index.html, so assert they were emitted rather than discovering it at
      # runtime.
      - name: Verify Drift web assets
        run: |
          test -f build/web/sqlite3.wasm || (echo "::error::sqlite3.wasm missing" && exit 1)
          test -f build/web/drift_worker.js || (echo "::error::drift_worker.js missing" && exit 1)
          ls -la build/web/sqlite3.wasm build/web/drift_worker.js

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: standup-web-release
          path: build/web
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux desktop. The Flutter engine links against GTK, so the same build
  # packages the TUI installs via `setup --linux-deps` are required here.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libblkid-dev uuid-dev libxss-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          defines=()
          if [ -n "$SUPABASE_URL" ]; then
            defines+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            defines+=("--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY")
          fi
          if [ ${#defines[@]} -eq 2 ]; then
            echo "Cloud features enabled."
          else
            echo "::warning::Supabase credentials are absent or incomplete; this build is local-only."
          fi
          # `flutter build linux` without -v captures the toolchain's stderr and
          # reports a link failure as a bare "clang++: error: linker command
          # failed", with the `undefined reference to ...` line — the only part
          # worth reading — nowhere in the log. That is what made this job
          # undiagnosable. Verbose streaming shows it; if the build still fails,
          # the link is re-run directly so the symbol is captured either way.
          if ! flutter build linux --release -v "${defines[@]}"; then
            echo "::error::Linux release build failed; re-running the link directly"
            if [ -d build/linux/x64/release ]; then
              cmake --build build/linux/x64/release --config Release --verbose || true
            else
              echo "No CMake build directory exists, so the link could not be re-run."
            fi
            exit 1
          fi

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: standup-linux-release
          path: build/linux/x64/release/bundle
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Apple targets. Disabled by default because Apple builds require a macOS
  # runner. Enable with the repository variable RUN_APPLE_CI = true.
  # ---------------------------------------------------------------------------
  build-apple:
    name: Apple release
    needs: verify
    if: ${{ vars.RUN_APPLE_CI == 'true' }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # No signing identity is configured here, so these produce unsigned
      # bundles suitable for local verification and simulator use only.
      - name: Build iOS (no codesign)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          defines=()
          if [ -n "$SUPABASE_URL" ]; then
            defines+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            defines+=("--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY")
          fi
          flutter build ios --release --no-codesign "${defines[@]}"

      - name: Build macOS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          defines=()
          if [ -n "$SUPABASE_URL" ]; then
            defines+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            defines+=("--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY")
          fi
          flutter build macos --release "${defines[@]}"

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standup-apple-release
          path: |
            build/ios/Runner
            build/macos/Build/Products/Release
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows desktop. Not gated: the hosted windows-latest image ships Visual
  # Studio 2022 with the "Desktop development with C++" workload, so this builds
  # on a stock runner. It was previously behind RUN_WINDOWS_CI on the assumption
  # that a self-hosted machine was needed.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows release
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          $defines = @()
          if ($env:SUPABASE_URL) { $defines += "--dart-define=SUPABASE_URL=$env:SUPABASE_URL" }
          if ($env:SUPABASE_PUBLISHABLE_KEY) { $defines += "--dart-define=SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY" }
          if ($defines.Count -eq 2) {
            Write-Host "Cloud features enabled."
          } else {
            Write-Host "::warning::Supabase credentials are absent or incomplete; this build is local-only."
          }
          flutter build windows --release $defines

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: standup-windows-release
          path: build/windows/x64/runner/Release
          retention-days: 14
